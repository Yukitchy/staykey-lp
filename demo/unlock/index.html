<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>お部屋のカギ ｜ StayKey</title>
<meta name="robots" content="noindex,nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@500;700;800;900&display=swap" rel="stylesheet">
<style>
  :root{
    color-scheme:light;
    --font-jp:"M PLUS Rounded 1c",-apple-system,BlinkMacSystemFont,"Hiragino Maru Gothic ProN",sans-serif;
    --ease:cubic-bezier(.22,1,.36,1);
    --spring:cubic-bezier(.34,1.56,.64,1);
    --teal:#0E9E9A; --teal-d:#0B5D64; --deep:#0E3A42; --soft:#E7F6F4;
    --coral:#F2664A; --coral-d:#c9482f; --gold:#FFC24B; --gold-soft:#FFF6E0;
    --green:#2E9E6B; --red:#D9544B;
    --ink:#26383B; --sub:#6A7B7B; --line:#E6E0D6; --bg:#F4F7F6;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
  body{font-family:var(--font-jp);font-weight:500;background:var(--bg);color:var(--ink);
    line-height:1.8;-webkit-font-smoothing:antialiased;min-height:100dvh;display:flex;flex-direction:column;}
  body,p,div,span,b,small,button,h1,h2{word-break:auto-phrase;line-break:strict;}
  h1,h2,.hint,.sub{text-wrap:balance;}

  /* header */
  .hd{background:linear-gradient(120deg,var(--teal),var(--teal-d));color:#fff;
    padding:calc(env(safe-area-inset-top) + 16px) 20px 18px;display:flex;align-items:center;gap:11px;}
  .hd .mk{width:34px;height:34px;flex:none;}
  .hd .tt small{display:block;font-size:10.5px;opacity:.85;font-weight:700;letter-spacing:.04em;}
  .hd .tt b{font-size:15.5px;}
  .gear{margin-left:auto;background:rgba(255,255,255,.18);border:none;color:#fff;
    width:34px;height:34px;border-radius:50%;font-size:16px;cursor:pointer;flex:none;}
  .gear:active{transform:scale(.94);}

  /* body */
  main{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
    padding:26px 22px calc(env(safe-area-inset-bottom) + 26px);gap:15px;text-align:center;}
  .badge{background:var(--soft);color:var(--teal-d);font-weight:800;font-size:13px;
    padding:7px 16px;border-radius:999px;font-variant-numeric:tabular-nums;}
  h1{font-size:21px;font-weight:900;}
  .sub{font-size:14px;color:var(--sub);}

  .codebox{width:100%;max-width:330px;background:linear-gradient(135deg,#FFF6E0,#FFEFC9);
    border:2.5px solid var(--gold);border-radius:16px;padding:13px 16px;
    box-shadow:0 6px 18px rgba(255,194,75,.4);animation:glow 2.4s ease-in-out infinite;
    font-family:inherit;cursor:pointer;}
  @keyframes glow{0%,100%{box-shadow:0 6px 16px rgba(255,194,75,.32)}50%{box-shadow:0 6px 26px rgba(255,194,75,.68)}}
  .codebox .l{font-size:11.5px;font-weight:800;color:#8a6a1e;}
  .codebox .n{font-size:34px;font-weight:900;letter-spacing:.24em;color:#5a4213;
    font-variant-numeric:tabular-nums;text-indent:.24em;line-height:1.25;}
  .codebox:active{transform:scale(.98);}

  input.code{width:100%;max-width:330px;font-size:30px;font-weight:900;text-align:center;
    letter-spacing:.28em;text-indent:.28em;padding:14px;border:2px solid var(--line);
    border-radius:15px;font-family:inherit;background:#fff;color:var(--ink);
    font-variant-numeric:tabular-nums;}
  input.code:focus{outline:none;border-color:var(--teal);box-shadow:0 0 0 4px var(--soft);}

  .btn{width:100%;max-width:330px;border:none;border-radius:15px;padding:17px;
    font-size:17px;font-weight:900;font-family:inherit;cursor:pointer;
    background:var(--coral);color:#fff;box-shadow:0 8px 20px rgba(242,102,74,.34);
    transition:transform .1s var(--spring);}
  .btn:active{transform:scale(.97);}
  .btn.sec{background:#fff;color:var(--teal-d);border:2px solid var(--soft);box-shadow:none;}
  .btn:disabled{opacity:.55;}

  .lock{width:172px;height:172px;border-radius:50%;display:grid;place-items:center;font-size:76px;
    background:radial-gradient(circle at 50% 36%,#7d8c8a,#4a5654);
    box-shadow:0 14px 34px rgba(20,60,60,.28);}
  .lock.open{background:radial-gradient(circle at 50% 36%,#3ac489,#1f8d63);
    box-shadow:0 14px 40px rgba(46,158,107,.5);animation:pop .5s var(--spring);}
  .lock.deny{background:radial-gradient(circle at 50% 36%,#e0736a,#b53b31);animation:shake .45s;}
  @keyframes pop{0%{transform:scale(.86)}60%{transform:scale(1.06)}100%{transform:scale(1)}}
  @keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-11px)}
    40%{transform:translateX(11px)}60%{transform:translateX(-7px)}80%{transform:translateX(7px)}}

  .spin{width:44px;height:44px;border:4px solid var(--soft);border-top-color:var(--teal);
    border-radius:50%;animation:sp .8s linear infinite;}
  @keyframes sp{to{transform:rotate(360deg)}}

  .hint{background:#fff;border:1px solid var(--line);border-radius:13px;padding:12px 15px;
    font-size:12.8px;color:var(--sub);max-width:330px;line-height:1.8;}
  .hint b{color:var(--teal-d);}
  .err{background:#FDECEA;border:1px solid #F5C9C1;color:var(--coral-d);
    border-radius:12px;padding:11px 14px;font-size:13px;font-weight:700;max-width:330px;}

  /* mode chip */
  .mode{position:fixed;left:50%;transform:translateX(-50%);
    bottom:calc(env(safe-area-inset-bottom) + 10px);font-size:11px;font-weight:800;
    padding:5px 12px;border-radius:999px;z-index:20;}
  .mode.sim{background:#EDEAE4;color:#8b8175;}
  .mode.real{background:var(--green);color:#fff;}

  /* settings sheet */
  .sheet{position:fixed;inset:0;background:rgba(10,25,28,.55);z-index:60;display:none;align-items:flex-end;}
  .sheet.on{display:flex;}
  .sh-b{background:#fff;width:100%;max-height:92dvh;overflow-y:auto;
    border-radius:22px 22px 0 0;padding:22px 20px calc(env(safe-area-inset-bottom) + 24px);
    animation:up .28s var(--ease);}
  @keyframes up{from{transform:translateY(100%)}to{transform:translateY(0)}}
  .sh-b h2{font-size:18px;font-weight:900;margin-bottom:4px;}
  .sh-b .d{font-size:12.8px;color:var(--sub);margin-bottom:16px;}
  .fld{margin-bottom:13px;}
  .fld label{display:block;font-size:12.5px;font-weight:800;color:var(--teal-d);margin-bottom:4px;}
  .fld input{width:100%;padding:11px 13px;border:1.5px solid var(--line);border-radius:11px;
    font-size:14px;font-family:inherit;background:#FAFCFB;}
  .fld input:focus{outline:none;border-color:var(--teal);background:#fff;}
  .fld small{display:block;font-size:11.3px;color:var(--sub);margin-top:3px;line-height:1.7;}
  .row2{display:flex;gap:9px;margin-top:6px;}
  .row2 .btn{max-width:none;padding:14px;font-size:15px;}
  .privacy{background:var(--gold-soft);border:1px dashed var(--gold);border-radius:11px;
    padding:11px 14px;font-size:12px;color:#8a6a1e;font-weight:700;margin-bottom:14px;line-height:1.75;}
  .status{font-size:12.5px;font-weight:800;padding:9px 13px;border-radius:10px;margin-bottom:13px;}
  .status.ok{background:#EAF7EF;color:var(--green);}
  .status.no{background:#EDEAE4;color:#8b8175;}
  @media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;}}
</style>
</head>
<body>

<div class="hd">
  <svg class="mk" viewBox="0 0 40 40" aria-hidden="true">
    <rect width="40" height="40" rx="11" fill="rgba(255,255,255,.18)"/>
    <circle cx="20" cy="15.4" r="9" fill="#FFC24B"/>
    <path d="M20 15.4V6.4a9 9 0 0 1 9 9z" fill="#0B5D64"/>
    <circle cx="20" cy="15.4" r="1.8" fill="#0B5D64"/>
    <path d="M20 24.2v8.8" stroke="#FFC24B" stroke-width="5.2" stroke-linecap="round"/>
    <path d="M20 27.8h5.4M20 31.2h4" stroke="#FFC24B" stroke-width="4.4" stroke-linecap="round"/>
  </svg>
  <div class="tt"><small id="hdSub">CANAL PALACE ・ 302号室</small><b>お部屋のカギ</b></div>
  <button class="gear" id="gear" aria-label="設定">⚙</button>
</div>

<main id="app"></main>
<div class="mode sim" id="mode">デモ表示</div>

<div class="sheet" id="sheet"><div class="sh-b">
  <h2>デモ設定</h2>
  <p class="d">実物のセサミを開けるための設定です。ユウキ専用。</p>
  <div class="status no" id="stat">未設定（デモ表示で動作中）</div>
  <div class="privacy">🔒 入力した鍵情報は<b>この端末のブラウザ内にだけ</b>保存されます。ページのソースにも、ネット上にも保存されません。</div>

  <div class="fld">
    <label>API Key</label>
    <input id="fApi" type="text" autocomplete="off" placeholder="partners.candyhouse.co で発行">
    <small>CANDY HOUSE のパートナーサイトで発行。ユーザーにつき1つ。</small>
  </div>
  <div class="fld">
    <label>デバイス UUID</label>
    <input id="fUuid" type="text" autocomplete="off" placeholder="XXXXXXXX-XXXX-XXXX-XXXX-XXXXXXXXXXXX">
    <small>SESAMEアプリ →「このセサミの鍵をシェア」のQRに含まれます。</small>
  </div>
  <div class="fld">
    <label>Secret Key</label>
    <input id="fSec" type="text" autocomplete="off" placeholder="32桁の英数字">
    <small>同上。デバイスごとに違います。</small>
  </div>
  <div class="fld">
    <label>表示する部屋名</label>
    <input id="fRoom" type="text" autocomplete="off" placeholder="CANAL PALACE ・ 302号室">
  </div>
  <div class="fld">
    <label>デモ用の予約番号</label>
    <input id="fCode" type="text" inputmode="numeric" maxlength="6" placeholder="4821">
  </div>

  <div class="row2">
    <button class="btn sec" id="btnClear">消去</button>
    <button class="btn" id="btnSave">保存</button>
  </div>
  <div class="row2">
    <button class="btn sec" id="btnTest">🔓 いま実機を開けてテスト</button>
  </div>
  <div id="testOut" style="margin-top:11px;"></div>
</div></div>

<script>
(function(){
  var LS='staykey_demo_cfg';
  var cfg={api:'',uuid:'',sec:'',room:'CANAL PALACE ・ 302号室',code:'4821'};
  try{ var raw=localStorage.getItem(LS); if(raw) cfg=Object.assign(cfg,JSON.parse(raw)); }catch(e){}

  var app=document.getElementById('app');
  var modeEl=document.getElementById('mode');
  function isReal(){ return !!(cfg.api && cfg.uuid && cfg.sec); }

  /* ---------- AES-CMAC (SESAME の署名) ---------- */
  function hexToBytes(h){
    h=(h||'').replace(/[^0-9a-fA-F]/g,'');
    var a=new Uint8Array(h.length/2);
    for(var i=0;i<a.length;i++) a[i]=parseInt(h.substr(i*2,2),16);
    return a;
  }
  function bytesToHex(b){
    return Array.prototype.map.call(b,function(x){return ('0'+x.toString(16)).slice(-2);}).join('');
  }
  function shl(a){
    var o=new Uint8Array(16), carry=0;
    for(var i=15;i>=0;i--){ o[i]=((a[i]<<1)|carry)&0xff; carry=(a[i]&0x80)?1:0; }
    if(a[0]&0x80) o[15]^=0x87;
    return o;
  }
  async function cmac(keyBytes,msg){
    var key=await crypto.subtle.importKey('raw',keyBytes,{name:'AES-CBC'},false,['encrypt']);
    var iv=new Uint8Array(16);
    async function enc(block){
      var ct=await crypto.subtle.encrypt({name:'AES-CBC',iv:iv},key,block);
      return new Uint8Array(ct).slice(0,16);
    }
    var L=await enc(new Uint8Array(16));
    var K1=shl(L), K2=shl(K1);
    var M=new Uint8Array(16);
    if(msg.length===16){ M.set(msg); for(var i=0;i<16;i++) M[i]^=K1[i]; }
    else { M.set(msg); M[msg.length]=0x80; for(var j=0;j<16;j++) M[j]^=K2[j]; }
    return await enc(M);
  }
  async function makeSign(secretHex){
    var ts=Math.floor(Date.now()/1000);
    var b=new ArrayBuffer(4); new DataView(b).setUint32(0,ts,true);
    var msg=new Uint8Array(b).slice(1,4);            // 3バイト
    var tag=await cmac(hexToBytes(secretHex),msg);
    return bytesToHex(tag);
  }
  async function realUnlock(){
    var sign=await makeSign(cfg.sec);
    var res=await fetch('https://app.candyhouse.co/api/sesame2/'+encodeURIComponent(cfg.uuid)+'/cmd',{
      method:'POST',
      headers:{'x-api-key':cfg.api,'Content-Type':'application/json'},
      body:JSON.stringify({cmd:88, history:btoa('StayKey demo'), sign:sign})
    });
    if(!res.ok) throw new Error('API '+res.status);
    return true;
  }

  /* ---------- 画面 ---------- */
  var state='input', errMsg='';
  function render(){
    document.getElementById('hdSub').textContent=cfg.room;
    modeEl.className='mode '+(isReal()?'real':'sim');
    modeEl.textContent=isReal()?'実機と接続中':'デモ表示';

    if(state==='input'){
      app.innerHTML=
        '<div class="badge">🗓 ご予約 10:00 – 13:00</div>'+
        '<h1>予約番号を入れてください</h1>'+
        '<p class="sub">アプリのインストールは不要です</p>'+
        '<button class="codebox" id="fill"><div class="l">お試し用の予約番号（タップで入力）</div>'+
          '<div class="n">'+cfg.code+'</div></button>'+
        '<input class="code" id="inp" inputmode="numeric" maxlength="6" placeholder="0000" aria-label="予約番号">'+
        (errMsg?'<div class="err">⚠️ '+errMsg+'</div>':'')+
        '<button class="btn" id="go">カギをあける 🔓</button>';
      var inp=document.getElementById('inp');
      document.getElementById('fill').onclick=function(){ inp.value=cfg.code; inp.focus(); };
      document.getElementById('go').onclick=function(){
        var v=(inp.value||'').trim();
        if(!v){ errMsg='予約番号を入れてください'; render(); return; }
        if(v!==cfg.code){ errMsg=''; state='deny'; render(); return; }
        errMsg=''; state='loading'; render(); doUnlock();
      };
      inp.addEventListener('keydown',function(e){ if(e.key==='Enter') document.getElementById('go').click(); });

    }else if(state==='loading'){
      app.innerHTML='<div class="spin"></div><p class="sub">ご予約を確認しています…</p>';

    }else if(state==='open'){
      app.innerHTML=
        '<div class="lock open">🔓</div>'+
        '<h1>解錠しました</h1>'+
        '<p class="sub">ようこそ、お部屋へ。<br>13:15を過ぎると自動で施錠されます。</p>'+
        '<div class="hint">✅ 鍵の受け渡しゼロ<br><b>予約した時間だけ</b>ひらきます</div>'+
        '<button class="btn sec" id="again">もう一度みる</button>';
      document.getElementById('again').onclick=function(){ state='input'; render(); };

    }else if(state==='deny'){
      app.innerHTML=
        '<div class="lock deny">🔒</div>'+
        '<h1>あきませんでした</h1>'+
        '<p class="sub">ご予約が確認できない番号です。<br>予約のない方・時間外は解錠できません。</p>'+
        '<button class="btn sec" id="back">もう一度ためす</button>';
      document.getElementById('back').onclick=function(){ state='input'; render(); };
    }
  }

  async function doUnlock(){
    if(isReal()){
      try{ await realUnlock(); }
      catch(e){ /* 失敗しても実演は止めない＝デモ表示として続行 */ }
    }
    setTimeout(function(){ state='open'; render(); }, isReal()?250:1000);
  }

  /* ---------- 設定 ---------- */
  var sheet=document.getElementById('sheet');
  function fillForm(){
    document.getElementById('fApi').value=cfg.api;
    document.getElementById('fUuid').value=cfg.uuid;
    document.getElementById('fSec').value=cfg.sec;
    document.getElementById('fRoom').value=cfg.room;
    document.getElementById('fCode').value=cfg.code;
    var st=document.getElementById('stat');
    if(isReal()){ st.className='status ok'; st.textContent='✅ 設定済み（実機に接続します）'; }
    else{ st.className='status no'; st.textContent='未設定（デモ表示で動作中）'; }
  }
  document.getElementById('gear').onclick=function(){ fillForm(); sheet.classList.add('on'); };
  sheet.onclick=function(e){ if(e.target===sheet) sheet.classList.remove('on'); };
  document.getElementById('btnSave').onclick=function(){
    cfg.api=document.getElementById('fApi').value.trim();
    cfg.uuid=document.getElementById('fUuid').value.trim();
    cfg.sec=document.getElementById('fSec').value.trim();
    cfg.room=document.getElementById('fRoom').value.trim()||'CANAL PALACE ・ 302号室';
    cfg.code=(document.getElementById('fCode').value.trim()||'4821');
    try{ localStorage.setItem(LS,JSON.stringify(cfg)); }catch(e){}
    fillForm(); sheet.classList.remove('on'); state='input'; render();
  };
  document.getElementById('btnClear').onclick=function(){
    if(!confirm('保存した鍵情報を消しますか？')) return;
    cfg={api:'',uuid:'',sec:'',room:'CANAL PALACE ・ 302号室',code:'4821'};
    try{ localStorage.removeItem(LS); }catch(e){}
    fillForm(); state='input'; render();
  };
  document.getElementById('btnTest').onclick=async function(){
    var out=document.getElementById('testOut');
    var a=document.getElementById('fApi').value.trim();
    var u=document.getElementById('fUuid').value.trim();
    var s=document.getElementById('fSec').value.trim();
    if(!a||!u||!s){ out.innerHTML='<div class="err">3つとも入力してください</div>'; return; }
    out.innerHTML='<div class="status no">送信中…</div>';
    var save={api:cfg.api,uuid:cfg.uuid,sec:cfg.sec};
    cfg.api=a; cfg.uuid=u; cfg.sec=s;
    try{
      await realUnlock();
      out.innerHTML='<div class="status ok">✅ 解錠コマンドを送りました。実機が回りましたか？</div>';
    }catch(e){
      out.innerHTML='<div class="err">届きませんでした（'+e.message+'）<br>'+
        '・ハブがネットに繋がっているか<br>・鍵情報が正しいか<br>'+
        '・ブラウザから直接叩けない場合（CORS）は中継サーバーが必要です</div>';
      cfg.api=save.api; cfg.uuid=save.uuid; cfg.sec=save.sec;
    }
  };

  render();
})();
</script>
</body>
</html>
